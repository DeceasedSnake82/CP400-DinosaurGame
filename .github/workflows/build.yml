name: Build and test

on:
  push:
    branches: [ "main", "claude/**" ]
    tags: [ 'v*.*.*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Rules, renderer and a look-ahead bot that plays 380k ticks (PC only, SDK headers only).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: classpaddev/hollyhock-3
          path: hollyhock-3
      - run: make -C test test SDK_DIR=$GITHUB_WORKSPACE/hollyhock-3/sdk
      - run: make -C test shots SDK_DIR=$GITHUB_WORKSPACE/hollyhock-3/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test/out/*.png

  # The calculator build: Dino.hh3. On a push to main the result is also committed back to
  # the repo (like Chess.hh3 / GameOfLife.hh3), so "download Dino.hh3" always works from main.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/classpaddev/hollyhock-3:v2.2.2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - uses: actions/checkout@v4
      - run: make -j && make fpucheck
      - uses: actions/upload-artifact@v4
        with:
          name: Dino.hh3
          path: Dino.hh3
      - name: Commit Dino.hh3 to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Dino.hh3
          if git diff --cached --quiet; then
            echo "Dino.hh3 is unchanged"
          else
            git commit -m "Build Dino.hh3 from ${GITHUB_SHA::7} [skip ci]"
            git push
          fi
